<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accordéon Diffusions — Édition pilote</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#253344;background:#f7f9fc;font-size:13px}
*{box-sizing:border-box}body{margin:0;padding:12px}button,select{font:inherit}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 12px;background:#fff;border:1px solid #e0e6ee;border-radius:9px;margin-bottom:12px}
.toolbar label{display:flex;align-items:center;gap:9px;font-weight:600;color:#3675d6;font-style:italic}
.toolbar-left,.toolbar-center{display:flex;align-items:center;gap:12px}
.toolbar-center{margin-inline:auto}
.toolbar .count{margin-left:0}
.toolbar select{color:#3675d6;border-color:#9dbbf4}
.toolbar button.small{display:inline-flex;align-items:center;gap:5px;color:#3675d6;border-color:#9dbbf4;padding:7px 10px}
.toolbar button.small svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Le bandeau compact reste sur une seule ligne, sans sacrifier la largeur des fiches. */
@media(max-width:620px){
 .toolbar{flex-wrap:nowrap;gap:7px;padding:9px 10px}
 .toolbar-left{gap:6px;min-width:0;flex:0 1 auto}
 .toolbar label{gap:0;white-space:nowrap;font-size:11px}
 .toolbar select{min-width:0;max-width:90px;padding:5px 5px;font-size:11px}
 .toolbar-center{order:0;width:auto;flex:0 0 auto;justify-content:center;margin:0 auto;gap:6px}
 .toolbar button.small{padding:5px;width:25px;height:27px;justify-content:center}
 .toolbar button.small .button-label{display:none}
 .toolbar button.small svg{width:15px;height:15px;flex-shrink:0}
 .toolbar .count{margin-left:0;flex:0 0 auto;padding:3px 7px;font-size:11px}
}
@media(max-width:345px){
 body{padding:8px}
 .toolbar{padding:8px 7px;gap:5px}
 .toolbar-left{gap:4px}
 .toolbar select{max-width:76px}
 .toolbar-center{gap:3px}
 .toolbar button.small{width:23px}
}
select{padding:6px 9px;border:1px solid #bdc8d6;border-radius:5px;background:white}
button.small{border:1px solid #cdd7e2;border-radius:5px;background:white;padding:6px 9px;cursor:pointer}
.count{margin-left:auto;background:#edf2f7;border-radius:12px;padding:3px 10px;color:#465c73;font-size:12px;font-weight:600}
.group{margin:7px 0;border:1px solid #dbe3ed;border-radius:8px;background:#fff;overflow:hidden}
.group.level1{border-left:5px solid var(--category-color,#dbe3ed)}
.group.level2,.group.level3{margin:7px 0 7px 13px;border-left:2px solid #dbe3ed}
.group-header{color:var(--category-text,#263b51);display:flex;gap:9px;align-items:center;width:100%;border:0;background:#fff;text-align:left;padding:11px 12px;cursor:pointer}
.level1>.group-header{background:#f8fafc;font-weight:700}
.level2>.group-header{background:#fbfcfe;font-weight:650}
.group-header>span:nth-child(2){color:var(--category-text,#263b51)!important}
.group-header:hover{background:#eef5fc}.chevron{width:11px;display:inline-block;transition:transform .15s}
.group-header[aria-expanded=true] .chevron{transform:rotate(90deg)}
.badge{margin-left:auto;background:#edf2f7;border-radius:12px;padding:2px 9px;color:#465c73;font-size:12px}
.group-body{padding:3px 9px 9px}.group-header[aria-expanded=false]+.group-body{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:10px;padding:8px}
.resource{position:relative;border:1px solid #dbe4ed;border-radius:8px;background:#fff;padding:13px 14px;box-shadow:0 1px 3px #0000000b}
.resource .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px}
.field{min-width:0}.field.full{grid-column:1/-1}.field .label{font-size:11px;color:#64758a;margin-bottom:4px}.field .value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.field.title .value{font-weight:650;color:#172d46}
.field.markdown .value{white-space:normal}.field.markdown .value > :first-child{margin-top:0}.field.markdown .value > :last-child{margin-bottom:0}.field.markdown h1,.field.markdown h2,.field.markdown h3{font-size:1em;line-height:1.4;margin:0.45em 0 0.2em}.field.markdown p,.field.markdown ul,.field.markdown ol{margin:0.3em 0}.field.markdown pre{white-space:pre-wrap;overflow-wrap:anywhere}.field.markdown img{max-width:100%;height:auto}.field a{color:#1265a8;text-decoration:underline}
.info{position:absolute;right:9px;top:8px;color:#6ca8e9;background:#eaf4ff;border:0;border-radius:50%;width:17px;height:17px;font-weight:700;font-size:12px;cursor:default}
/* Info-bulle explicite : pas de curseur « ? » ni de délai du title natif. */
.info{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:14px;line-height:17px;text-align:center;padding:0;cursor:default}
.info-tooltip{position:absolute;z-index:5;right:7px;top:32px;background:#173b68;color:#fff;border-radius:6px;padding:7px 10px;font:12px system-ui,sans-serif;white-space:nowrap;max-width:min(90%,280px);overflow-wrap:anywhere;box-shadow:0 3px 12px #0002;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.info:hover+.info-tooltip,.info:focus+.info-tooltip{opacity:1;visibility:visible}
.resource .fields{padding-right:15px}.empty{padding:30px 12px;text-align:center;color:#66778b}
.error{padding:12px;border:1px solid #edb4b4;color:#a02626;background:#fff5f5;border-radius:8px}
@media(max-width:520px){
 body{padding:5px}
 .group{margin:5px 0;border-radius:7px}
 .group.level2,.group.level3{margin:5px 0 5px 0;border-left:0;border-right:0;border-bottom:0;border-radius:0;box-shadow:none}
 .group-body{padding:2px 0 5px}
 .group-header{padding:9px 7px;gap:6px}
 .cards{padding:4px 0;gap:6px;grid-template-columns:minmax(0,1fr)}
 .resource{padding:11px 10px;min-width:0}
 .resource .fields{grid-template-columns:1fr;gap:9px}
 .field{grid-column:1/-1}
}
@media(max-width:345px){.group.level2,.group.level3{margin-left:0}.group-body{padding-left:2px;padding-right:2px}}

/* Icône crayon et modale sur le modèle du Planning */
.edit-open{position:absolute;right:9px;bottom:9px;border:1px solid #b9c9df;background:#fff;color:#385b80;border-radius:5px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer}
.edit-open:hover{background:#eaf4ff}
.resource{padding-bottom:43px}
.modal-backdrop[hidden]{display:none!important}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-panel{width:min(560px,100%);max-height:min(90vh,850px);overflow:auto;background:white;box-shadow:0 14px 40px #0003;padding:20px;border-radius:6px}
.modal-panel h2{margin:0 0 14px;font-size:17px;color:#253344}
.modal-panel .edit-form{gap:14px}
.modal-panel .edit-form textarea{min-height:150px}
.modal-panel .edit-actions{margin-top:14px}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.edit-actions button{border:1px solid #a6bdd6;background:#f5faff;color:#205d9e;border-radius:5px;padding:6px 11px;cursor:pointer}
.edit-actions button.primary{background:#236eb8;color:white;border-color:#236eb8}
.edit-actions button:disabled{opacity:.5;cursor:wait}
.edit-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.edit-form label{display:flex;flex-direction:column;gap:4px;color:#536b82;font-size:11px}
.edit-form label.wide{grid-column:1/-1}
.edit-form input,.edit-form select,.edit-form textarea{width:100%;min-width:0;border:1px solid #b5c7dc;border-radius:5px;padding:8px;font:13px system-ui,sans-serif;color:#253344;background:white}
.edit-form textarea{min-height:90px;resize:vertical}
.edit-status{margin-top:8px;font-size:12px;white-space:pre-wrap}
.edit-status.error{color:#a02626}.edit-status.ok{color:#236a35}
@media(max-width:520px){.edit-form{grid-template-columns:1fr}.edit-form label{grid-column:1/-1}}
</style></head><body>
<div class="toolbar">
  <div class="toolbar-left"><label for="level3">Classer par</label><select id="level3" aria-label="Classer par"><option value="none">Aucun</option><option value="type">Type</option><option value="seance">Séance</option></select></div>
  <div class="toolbar-center">
    <button class="small" id="expand" type="button" title="Tout déplier" aria-label="Tout déplier"><span class="button-label">Tout déplier</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 6 5 5 5-5M7 13l5 5 5-5"/></svg></button>
    <button class="small" id="collapse" type="button" title="Tout replier" aria-label="Tout replier"><span class="button-label">Tout replier</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 11 5-5 5 5M7 18l5-5 5 5"/></svg></button>
  </div>
  <span class="count" id="count" aria-label="Nombre total de diffusions"></span>
</div>
<main id="content" aria-live="polite"><div class="empty">En attente des diffusions Grist…</div></main>
<div id="editor-modal" class="modal-backdrop" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Modifier la ressource</h2><div id="modal-body"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script type="module">
import {esc, safeColor, groupRecords} from './groupes.logic.js';
'use strict';
const F={
 category:'Cours_categorie_Ressource',course:'txt_Cours_Nom_complet',
 type:'Type_Ressource',seance:'txt_Seance_Libelle',title:'txt_Titre_Ressource',
 url:'URL_Ressource',owner:'txt_Proprietaire_Ressource',expiry:'Expire_le',
 comment:'Commentaire_Ressource',state:'Etat',resourceRef:'txt_Reference_Ressource',
 diffusionRef:'Reference',color:'Cours_CatCours',resourceId:'Ressource'
};
const REQUIRED=Object.values(F);
let editingId=null, editingBusy=false, editTrigger=null;
let resourceRows=new Map(), diffusionRows=new Map(), ownerRows=[];
let records=[], opts={level3:'seance'}, openBranches=new Set();
// Navigation: l'API des options Grist est asynchrone et ses modifications
// peuvent rester temporaires jusqu'à validation dans la barre du widget.
// sessionStorage sauvegarde immédiatement l'état de consultation dans cet onglet.
// Les options Grist ne servent ici qu'à la préférence « Classer par ».
const NAV_KEY='accordeon-diffusions-v21-navigation-'+location.pathname;
let navigationRestored=false, optionsReceived=false, recordsReceived=false;
let restorePending=false, scrollSavePending=false;
let savedPosition=0;
function getScrollY(){
 return Math.max(window.scrollY||0,document.scrollingElement?.scrollTop||0,document.documentElement.scrollTop||0);
}
function setScrollY(y){
 const n=Math.max(0,Number(y)||0);
 window.scrollTo(0,n);
 if(document.scrollingElement)document.scrollingElement.scrollTop=n;
}
function readNavigation(){
 try{const s=sessionStorage.getItem(NAV_KEY);return s?JSON.parse(s):null;}catch(e){console.warn('Navigation locale indisponible',e);return null;}
}
function saveNavigation(){
 if(!navigationRestored)return;
 savedPosition=getScrollY();
 try{sessionStorage.setItem(NAV_KEY,JSON.stringify({level3:opts.level3,openBranches:[...openBranches],scrollY:savedPosition}));}
 catch(e){console.warn('Sauvegarde navigation impossible',e);}
}
function restoreScroll(){
 if(!restorePending||!recordsReceived||!optionsReceived)return;
 restorePending=false;
 // Attendre que les groupes restaurés soient effectivement présents et mesurés.
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  setScrollY(savedPosition);
  requestAnimationFrame(()=>setScrollY(savedPosition));
 }));
}
function initializeNavigation(){
 if(navigationRestored||!optionsReceived)return;
 const saved=readNavigation();
 if(saved){
  if(['none','type','seance'].includes(saved.level3))opts.level3=saved.level3;
  openBranches=new Set(Array.isArray(saved.openBranches)?saved.openBranches:[]);
  savedPosition=Math.max(0,Number(saved.scrollY)||0);
  restorePending=true;
 }
 navigationRestored=true;
 syncControls();render();restoreScroll();
}
const content=document.getElementById('content');
function text(v){if(v===null||v===undefined)return '';if(Array.isArray(v))return v.slice(1).join(', ');return String(v);}
function value(r,k){return text(r[F[k]]);}
function groupLabel(r,key){const t=value(r,key).trim();return t||(key==='seance'?'Ressource diffusée hors séance':'Non renseigné');}
function normalizeColor(v){
 let x=text(v).trim();
 if(/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(x))return x;
 if(/^[0-9a-f]{6}$/i.test(x))return '#'+x;
 return '#cbd5e1';
}
function readableCategoryColor(v){
 const hex=normalizeColor(v).slice(1);
 const full=hex.length===3?hex.split('').map(c=>c+c).join(''):hex;
 const rgb=[0,2,4].map(i=>parseInt(full.slice(i,i+2),16));
 // La teinte métier est conservée, mais assombrie si nécessaire pour lire le texte.
 const factor=Math.min(1,115/Math.max(...rgb));
 return '#'+rgb.map(n=>Math.round(n*factor).toString(16).padStart(2,'0')).join('');
}
function urlValue(v){
 const s=text(v).trim();
 // Grist hyperlink cells may contain "label URL" separated by whitespace.
 const m=s.match(/https?:\/\/[^\s]+/i);
 if(!m)return null;
 try{const u=new URL(m[0]);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch{return null;}
}
function formatDate(v){
 if(v===null||v===undefined||v==='')return '';
 let d;
 if(v instanceof Date)d=v;
 else if(typeof v==='number'||(/^\d{10,13}$/.test(String(v).trim()))){
  const n=Number(v);
  // Grist peut transmettre des secondes Unix, ou une date déjà convertie en millisecondes.
  d=new Date(Math.abs(n)<1e11?n*1000:n);
 }else d=new Date(String(v));
 if(!Number.isFinite(d.getTime()))return text(v);
 return new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Paris'}).format(d).replace(',', ' à');
}
function markdown(v){
 const source=text(v);
 if(!source.trim())return '';
 if(!window.marked||!window.DOMPurify)return esc(source);
 const html=window.marked.parse(source,{gfm:true,breaks:true});
 return window.DOMPurify.sanitize(html,{USE_PROFILES:{html:true}});
}
function field(label,body,full=false,title=false,markdownField=false){
 return `<div class="field ${full?'full':''} ${title?'title':''} ${markdownField?'markdown':''}"><div class="label">${esc(label)}</div><div class="value">${body}</div></div>`;
}
function card(r){
 const third=opts.level3;
 const url=urlValue(r[F.url]);
 const fields=[];
 function add(label,key,full=false,title=false){const v=value(r,key);if(v.trim())fields.push(field(label,esc(v),full,title));}
 // Les champs vides ne génèrent ni libellé ni espace réservé.
 if(third!=='seance')add('Séance','seance',true);
 add('Titre','title',true,true);
 if(third!=='type')add('Type','type');
 if(url)fields.push(field('URL',`<a href="${esc(url)}" title="${esc(url)}" target="_blank" rel="noopener noreferrer">Ouvrir la ressource</a>`,third==='type'));
 else add('URL','url',third==='type');
 add('Propriétaire','owner');
 const expiry=formatDate(r[F.expiry]);if(expiry)fields.push(field('Expire le',esc(expiry)));
 const comment=value(r,'comment');if(comment.trim())fields.push(field('Commentaire',markdown(comment),true,false,true));
 const ref=value(r,'resourceRef');
 return `<article class="resource" data-diffusion-id="${esc(r.id)}"><span class="info" tabindex="0" aria-label="Référence ressource : ${esc(ref)}" role="img">i</span><span class="info-tooltip" role="tooltip">${esc(ref)}</span><div class="fields">${fields.join('')}</div><button type="button" class="edit-open" data-edit="${esc(r.id)}" aria-label="Modifier cette ressource et sa date d'expiration" title="Modifier">✎</button></article>`;
}
function partition(rows,key){
 // Réutilisation du moteur de regroupement et de tri de la V2 générique.
 // La valeur de substitution est uniquement destinée au niveau Séance.
 const normalized=rows.map(r=>({...r, __v21Group:groupLabel(r,key)}));
 return groupRecords(normalized,'__v21Group','alpha-asc').map(g=>[
   String(g.label),g.records.map(({__v21Group,...r})=>r)
 ]);
}
function group(rows,key,depth,path){
 return partition(rows,key).map(([label,items])=>{
  const id=JSON.stringify([path,key,label]);
  const expanded=openBranches.has(id);
  const childKey=depth===1?'course':depth===2?(opts.level3==='type'?'type':opts.level3==='seance'?'seance':null):null;
  const inside=childKey?group(items,childKey,depth+1,id):`<div class="cards">${items.map(card).join('')}</div>`;
  const style=`style="--category-color:${normalizeColor(items[0][F.color])};--category-text:${readableCategoryColor(items[0][F.color])}"`;
  return `<section class="group level${depth}" ${style}><button type="button" class="group-header" data-branch="${esc(id)}" aria-expanded="${expanded}" aria-controls="branch-${esc(encodeURIComponent(id))}"><span class="chevron" aria-hidden="true">▶</span><span>${esc(label)}</span><span class="badge">${items.length}</span></button><div class="group-body" id="branch-${esc(encodeURIComponent(id))}">${inside}</div></section>`;
 }).join('');
}
function render(){
 document.getElementById('count').textContent=records.length;
 if(!records.length){content.innerHTML='<div class="empty">Aucune diffusion transmise par Grist.</div>';return;}
 const missing=REQUIRED.filter(k=>!(k in records[0]));
 if(missing.length){content.innerHTML='<div class="error">Colonnes manquantes dans les données reçues : '+missing.map(esc).join(', ')+'. Vérifier les colonnes transmises au widget.</div>';return;}
 content.innerHTML=group(records,'category',1,'root');
 content.querySelectorAll('.edit-open').forEach(b=>b.addEventListener('click',()=>openEditor(Number(b.dataset.edit))));
 content.querySelectorAll('[data-branch]').forEach(btn=>btn.addEventListener('click',()=>{
   const id=btn.dataset.branch;if(openBranches.has(id))openBranches.delete(id);else openBranches.add(id);
   // Le rendu remplace le bouton activé : rétablir explicitement son focus.
   const scroll=getScrollY();
   render();
   const replacement=Array.from(content.querySelectorAll('[data-branch]'))
     .find(candidate=>candidate.dataset.branch===id);
   if(replacement){
     try{replacement.focus({preventScroll:true});}
     catch(e){replacement.focus();}
   }
   setScrollY(scroll);
   saveNavigation();
 }));
}
function syncControls(){
 document.getElementById('level3').value=opts.level3;
}
document.getElementById('level3').addEventListener('change',e=>{
 opts.level3=e.target.value;openBranches.clear();setScrollY(0);render();saveNavigation();
 // Préférence de classement dans les options du widget Grist.
 grist.setOption('diffusionsV21',{level3:opts.level3}).catch(console.warn);
});
document.getElementById('expand').addEventListener('click',()=>{
 openBranches.clear();content.innerHTML=group(records,'category',1,'root');
 content.querySelectorAll('[data-branch]').forEach(x=>openBranches.add(x.dataset.branch));render();saveNavigation();
});
document.getElementById('collapse').addEventListener('click',()=>{openBranches.clear();render();saveNavigation();});
window.addEventListener('scroll',()=>{
 if(scrollSavePending)return;
 scrollSavePending=true;
 requestAnimationFrame(()=>{scrollSavePending=false;saveNavigation();});
},{passive:true});
window.addEventListener('pagehide',saveNavigation);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNavigation();});

// Les données brutes sont relues depuis Grist : la valeur affichée d'une référence
// peut être un libellé et non l'identifiant de la ligne liée.
function toRows(data){
 if(Array.isArray(data))return data;
 if(!data||!Array.isArray(data.id))throw Error('Format de table inattendu');
 return data.id.map((id,i)=>Object.fromEntries(Object.entries(data).map(([k,v])=>[k,Array.isArray(v)?v[i]:v]).concat([['id',id]])));
}
async function refreshCache(){
 const [res,dif,users]=await Promise.all(['Ressources','Diffusions','Utilisateurs'].map(t=>grist.docApi.fetchTable(t)));
 resourceRows=new Map(toRows(res).map(r=>[Number(r.id),r]));
 diffusionRows=new Map(toRows(dif).map(r=>[Number(r.id),r]));
 ownerRows=toRows(users);
}
// Lit les choix réels de Ressources.Type dans les métadonnées Grist.
async function loadTypeChoices(){
 const [tablesData,colsData]=await Promise.all([
  grist.docApi.fetchTable('_grist_Tables'),
  grist.docApi.fetchTable('_grist_Tables_column')
 ]);
 const tables=toRows(tablesData),cols=toRows(colsData);
 const table=tables.find(t=>t.tableId==='Ressources');
 if(!table)throw Error('Métadonnées de la table Ressources introuvables.');
 const col=cols.find(c=>Number(c.parentId)===Number(table.id)&&c.colId==='Type');
 if(!col||col.type!=='Choice')throw Error('Ressources.Type doit être une colonne Choix unique (Choice).');
 let options;
 try{options=typeof col.widgetOptions==='string'?JSON.parse(col.widgetOptions||'{}'):(col.widgetOptions||{});}
 catch{throw Error('Options de Ressources.Type illisibles.');}
 const choices=options.choices;
 if(!Array.isArray(choices)||!choices.length||!choices.every(v=>typeof v==='string'))throw Error('Aucun choix valide trouvé dans Ressources.Type.');
 return [...new Set(choices)];
}
function ownerLabel(u){return [u.Prenom,u.Nom].filter(Boolean).join(' ').trim()||String(u.Email||u.id);}
function escAttr(v){return esc(String(v??''));}
function parisInput(epoch){
 if(epoch===null||epoch===undefined||epoch==='')return '';
 const d=new Date(Number(epoch)*1000);if(!Number.isFinite(d.getTime()))return '';
 const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
 const x=Object.fromEntries(f.formatToParts(d).map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}T${x.hour}:${x.minute}`;
}
// Convertit une heure murale Paris en secondes Unix, sans supposer un décalage fixe.
function parisEpoch(local){
 if(!local)return null;
 const [ymd,hm]=local.split('T');if(!ymd||!hm)throw Error('Date/heure incorrecte');
 const [y,m,d]=ymd.split('-').map(Number),[h,mi]=hm.split(':').map(Number);
 const target=`${ymd}T${hm}`;
 const base=Date.UTC(y,m-1,d,h,mi);
 const matches=[];
 for(let off=-120;off<=180;off+=30){const sec=(base+off*60000)/1000;if(parisInput(sec)===target)matches.push(sec);}
 if(!matches.length)throw Error('Cette heure locale est inexistante en Europe/Paris (passage à l’heure d’été).');
 if(matches.length>1)throw Error('Heure ambiguë lors du passage à l’heure d’hiver : choisir une autre heure.');
 return matches[0];
}
const modal=document.getElementById('editor-modal');
const modalBody=document.getElementById('modal-body');
function closeEditor(){
 if(editingBusy)return;
 modal.hidden=true;modalBody.innerHTML='';editingId=null;
 if(editTrigger?.isConnected)editTrigger.focus({preventScroll:true});
 editTrigger=null;
}
modal.addEventListener('click',e=>{if(e.target===modal)closeEditor();});
document.addEventListener('keydown',e=>{
 if(modal.hidden)return;
 if(e.key==='Escape'){e.preventDefault();closeEditor();return;}
 if(e.key==='Tab'){
  const els=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')];
  if(!els.length)return;
  const first=els[0],last=els[els.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});
async function openEditor(id){
 if(editingBusy)return;
 editTrigger=document.activeElement;
 editingId=id;modal.hidden=false;modalBody.innerHTML='<div class="edit-status">Chargement des données…</div>';
 try{
  await refreshCache();
  // Les lignes transmises au widget peuvent porter un identifiant de vue
  // différent de l'identifiant réel de Diffusions. Résoudre par la référence
  // métier de diffusion, jamais par le titre de la ressource.
  const shown=records.find(x=>Number(x.id)===id);
  if(!shown)throw Error('Ligne affichée introuvable.');
  let d=diffusionRows.get(id);
  const ref=String(shown[F.diffusionRef]??'').trim();
  if(!d || (ref && String(d.Reference??'').trim()!==ref)){
   const matches=[...diffusionRows.values()].filter(x=>ref && String(x.Reference??'').trim()===ref);
   if(matches.length!==1)throw Error('Impossible d’identifier la diffusion de façon unique. Vérifier le mappage de la colonne Reference.');
   d=matches[0];
  }
  const diffusionId=Number(d.id);
  const rid=Number(d.Ressource);
  if(!Number.isInteger(rid)||rid<=0)throw Error('Référence Diffusions.Ressource indisponible ou non numérique.');
  const r=resourceRows.get(rid);
  if(!r)throw Error('Ressource liée introuvable ou non accessible.');
  const allowedTypes=await loadTypeChoices();
  const typeOptions=allowedTypes.map(v=>`<option value="${escAttr(v)}" ${String(r.Type??'')===v?'selected':''}>${esc(v)}</option>`).join('');
  const choices=ownerRows.map(u=>`<option value="${escAttr(u.id)}" ${Number(r.Propriete_de)===Number(u.id)?'selected':''}>${esc(ownerLabel(u))}</option>`).join('');
  modalBody.innerHTML=`<form class="edit-form" data-form="${diffusionId}">
   <label class="wide">Titre<input name="Titre" required value="${escAttr(r.Titre)}"></label>
   <label>Type<select name="Type" required><option value="" disabled ${!allowedTypes.includes(String(r.Type??''))?'selected':''}>— Choisir un type —</option>${typeOptions}</select></label>
   <label>URL<input name="URL" type="url" value="${escAttr(r.URL)}"></label>
   <label>Propriétaire<select name="Propriete_de"><option value="">— Aucun —</option>${choices}</select></label>
   <label>Expire le (Paris)<input name="Expire_le" type="datetime-local" value="${escAttr(parisInput(d.Expire_le))}"></label>
   <label class="wide">Commentaire<textarea name="Commentaire">${esc(r.Commentaire??'')}</textarea></label>
   <div class="edit-actions" style="grid-column:1/-1"><button type="button" class="edit-cancel">Annuler</button><button class="primary" type="submit">Enregistrer</button></div>
   <div class="edit-status" style="grid-column:1/-1" role="status"></div>
  </form>`;
  const form=modalBody.querySelector('form');
  form.querySelector('.edit-cancel').addEventListener('click',closeEditor);
  form.addEventListener('submit',ev=>{ev.preventDefault();saveEditor(form,diffusionId,rid,r,d);});
  form.querySelector('[name="Titre"]').focus({preventScroll:true});
 }catch(e){modalBody.innerHTML=`<div class="edit-status error" role="alert">${esc(e.message)}</div><div class="edit-actions"><button type="button" class="edit-cancel">Fermer</button></div>`;modalBody.querySelector('button').addEventListener('click',closeEditor);modalBody.querySelector('button').focus();}
}
async function saveEditor(form,id,rid,oldR,oldD){
 if(editingBusy)return;
 const el=n=>form.elements.namedItem(n);
 const status=form.querySelector('.edit-status');
 try{
  const res={Titre:el('Titre').value.trim(),Type:el('Type').value.trim(),URL:el('URL').value.trim(),Commentaire:el('Commentaire').value,Propriete_de:el('Propriete_de').value?Number(el('Propriete_de').value):0};
  if(!res.Titre)throw Error('Le titre est obligatoire.');
  const currentTypes=await loadTypeChoices();
  if(!currentTypes.includes(res.Type))throw Error('Type non autorisé : choisissez une valeur actuellement définie dans Grist.');
  const expiry=parisEpoch(el('Expire_le').value);
  const changedR=Object.fromEntries(Object.entries(res).filter(([k,v])=>String(oldR[k]??(k==='Propriete_de'?0:''))!==String(v)));
  const expiryChanged=(oldD.Expire_le==null?null:Number(oldD.Expire_le))!==expiry;
  if(!Object.keys(changedR).length&&!expiryChanged){status.textContent='Aucune modification.';return;}
  editingBusy=true;form.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=true);
  status.className='edit-status';status.textContent='Enregistrement…';
  // Action unique atomique sur deux tables : Grist valide les ACL côté serveur.
  const actions=[];
  if(Object.keys(changedR).length)actions.push(['UpdateRecord','Ressources',rid,changedR]);
  if(expiryChanged)actions.push(['UpdateRecord','Diffusions',id,{Expire_le:expiry}]);
  await grist.docApi.applyUserActions(actions);
  status.className='edit-status ok';status.textContent='Modifications enregistrées.';
  await refreshCache();
  editingId=null;
  setTimeout(()=>{if(!editingBusy){modal.hidden=true;modalBody.innerHTML='';if(editTrigger?.isConnected)editTrigger.focus({preventScroll:true});editTrigger=null;}},900);
 }catch(e){status.className='edit-status error';status.textContent='Enregistrement refusé : '+e.message;}
 finally{editingBusy=false;form.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=false);}
}

grist.ready({requiredAccess:'full'});
grist.onOptions(o=>{
 const saved=o?.diffusionsV21;
 // Les préférences Grist ne remplacent pas l'état local après initialisation.
 if(!navigationRestored&&saved&&['none','type','seance'].includes(saved.level3))opts.level3=saved.level3;
 optionsReceived=true;initializeNavigation();
});
grist.onRecords(rows=>{
 records=rows||[];recordsReceived=true;refreshCache().catch(e=>console.warn('Cache édition',e));
 if(optionsReceived)initializeNavigation();
 else render();
 if(navigationRestored){render();restoreScroll();}
});
syncControls();
</script></body></html>
